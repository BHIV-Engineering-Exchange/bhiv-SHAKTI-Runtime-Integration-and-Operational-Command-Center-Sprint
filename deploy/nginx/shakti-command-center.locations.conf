# ==============================================================================
# SHAKTI Command Center — Production Nginx Location Fragment
# ==============================================================================
# Architecture: VM Host-Level Nginx Reverse Proxy
# Target: Include inside existing server { ... } block on VM
# Frontend Target: http://127.0.0.1:5176 (SHAKTI Docker container)
# Upstream Target: http://163.128.209.18:<PORT>/ (Microservices)
#
# NOTE:
# 1. Trailing slashes on location and proxy_pass strip the /api/<service>/ prefix.
# 2. Exact match rules (= /api/<service>) issue a 301 redirect to /api/<service>/
#    to prevent accidental fallthrough to the SPA frontend.
# 3. Direct HTTPS dependencies (e.g. Niyantran) are not proxied here.
# 4. Vite development-only routes (control-plane-8003/8009) are excluded.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Control Plane Service (Port 8120)
# ------------------------------------------------------------------------------
location = /api/control-plane {
    return 301 $request_uri/;
}
location /api/control-plane/ {
    proxy_pass http://163.128.209.18:8120/;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

