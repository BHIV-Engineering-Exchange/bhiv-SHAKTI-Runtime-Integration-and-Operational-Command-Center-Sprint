# ------------------------------------------------------------------------------
# 11. SHAKTI Frontend SPA Fallback (Container Host Port 5176)
# ------------------------------------------------------------------------------
# All static assets and client-side SPA routes (non-API) pass to the local
# Docker container running `serve -s dist -l 5173`.
location / {
    proxy_pass http://127.0.0.1:5176;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
